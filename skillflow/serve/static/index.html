<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillFlow</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; color: #333; }

/* Header */
.header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 12px 24px; display: flex; align-items: center; gap: 32px; }
.header h1 { font-size: 18px; font-weight: 600; color: #1a1a1a; }
.header .task-indicator { margin-left: auto; font-size: 13px; color: #888; }
.header .task-indicator .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.header .task-indicator .dot.idle { background: #ccc; }
.header .task-indicator .dot.running { background: #4caf50; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

/* Tabs */
.tabs { display: flex; gap: 0; background: #fff; border-bottom: 2px solid #e0e0e0; padding: 0 24px; }
.tab { padding: 10px 20px; cursor: pointer; font-size: 14px; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.2s; }
.tab:hover { color: #333; }
.tab.active { color: #1976d2; border-bottom-color: #1976d2; font-weight: 500; }

/* Content */
.content { max-width: 960px; margin: 24px auto; padding: 0 24px; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* Cards */
.card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
.card h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: #1a1a1a; }

/* Form */
.form-row { display: flex; gap: 12px; margin-bottom: 12px; align-items: center; }
.form-row label { font-size: 13px; color: #555; min-width: 80px; }
.form-row select, .form-row input[type="text"], .form-row input[type="number"] {
  flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; background: #fff;
}
.spec-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.spec-row label { font-size: 13px; color: #555; min-width: 80px; }
.spec-row select, .spec-row input { flex: 1; }
textarea.spec-editor {
  width: 100%; min-height: 200px; padding: 12px; border: 1px solid #ddd; border-radius: 4px;
  font-family: "SF Mono", Monaco, monospace; font-size: 12px; resize: vertical; background: #fafafa; color: #333;
}
textarea.spec-editor:focus { outline: none; border-color: #1976d2; }
.form-row select:focus, .form-row input:focus { outline: none; border-color: #1976d2; }
.form-row input[type="range"] { flex: 1; }
.form-row .range-value { font-size: 13px; color: #555; min-width: 36px; text-align: center; }
.checkbox-row { display: flex; gap: 16px; margin-bottom: 12px; }
.checkbox-row label { font-size: 13px; color: #555; display: flex; align-items: center; gap: 6px; }

/* Button */
.btn { padding: 8px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; transition: background 0.2s; }
.btn-primary { background: #1976d2; color: #fff; }
.btn-primary:hover { background: #1565c0; }
.btn-primary:disabled { background: #bbb; cursor: not-allowed; }
.btn-danger { background: #fff; color: #d32f2f; border: 1px solid #d32f2f; }
.btn-danger:hover { background: #ffebee; }
.btn-outline { background: #fff; color: #1976d2; border: 1px solid #d0d0d0; padding: 5px 14px; font-size: 12px; }
.btn-outline:hover { border-color: #1976d2; background: #f5f9ff; }

/* Progress */
.progress-area { min-height: 40px; }
.log-line { font-family: "SF Mono", Monaco, monospace; font-size: 12px; color: #555; padding: 2px 0; }
.log-line.success { color: #2e7d32; }
.log-line.error { color: #d32f2f; }
.log-line.info { color: #1565c0; }

/* Results table */
.result-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
.result-table th { text-align: left; padding: 8px 12px; background: #f5f5f5; border-bottom: 2px solid #e0e0e0; color: #555; font-weight: 600; }
.result-table td { padding: 8px 12px; border-bottom: 1px solid #eee; }
.result-table tr:hover td { background: #fafafa; }

.badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; }
.badge-pass { background: #e8f5e9; color: #2e7d32; }
.badge-fail { background: #ffebee; color: #c62828; }
.badge-accepted { background: #e8f5e9; color: #2e7d32; }
.badge-rejected { background: #ffebee; color: #c62828; }

/* Summary */
.summary-box { background: #f5f5f5; border-radius: 6px; padding: 16px; margin-top: 12px; }
.summary-box .metric { display: inline-block; margin-right: 24px; }
.summary-box .metric .label { font-size: 12px; color: #888; }
.summary-box .metric .value { font-size: 20px; font-weight: 600; color: #1a1a1a; }

/* Skill content preview */
.content-preview { background: #f5f5f5; border-radius: 6px; padding: 16px; margin-top: 12px; max-height: 400px; overflow-y: auto; }
.content-preview pre { font-family: "SF Mono", Monaco, monospace; font-size: 12px; white-space: pre-wrap; color: #333; }

/* Test cases textarea */
.tc-area { margin-top: 8px; margin-bottom: 12px; }
.tc-area textarea {
  width: 100%; min-height: 160px; padding: 12px; border: 1px solid #ddd; border-radius: 4px;
  font-family: "SF Mono", Monaco, monospace; font-size: 12px; resize: vertical; background: #fafafa; color: #333;
}
.tc-area textarea:focus { outline: none; border-color: #1976d2; }
.tc-actions { display: flex; gap: 8px; margin-bottom: 12px; }

/* Evolve history chart */
.chart-container { margin-top: 12px; height: 200px; position: relative; }
.chart-bar { position: absolute; bottom: 0; width: 20px; border-radius: 2px 2px 0 0; transition: all 0.3s; }
.chart-bar.accepted { background: #4caf50; }
.chart-bar.rejected { background: #ef5350; }
.chart-bar.skip { background: #bdbdbd; }
.chart-label { position: absolute; bottom: -18px; font-size: 10px; color: #888; width: 20px; text-align: center; }
.chart-y-axis { position: absolute; left: 0; width: 100%; border-top: 1px dashed #ddd; }
.chart-y-label { position: absolute; left: -30px; font-size: 10px; color: #888; transform: translateY(-50%); }

/* Upload drop zone */
.upload-drop-zone { border: 2px dashed #ccc; border-radius: 8px; padding: 32px 16px; text-align: center; cursor: pointer; transition: all 0.2s; position: relative; }
.upload-drop-zone:hover { border-color: #1976d2; background: #f5f9ff; }
.upload-drop-zone.dragover { border-color: #1976d2; background: #e3f2fd; }
.upload-drop-zone .upload-hint { color: #888; font-size: 13px; }
.upload-drop-zone.has-file { border-color: #4caf50; background: #f1f8f1; }
.upload-result { margin-top: 8px; padding: 8px 12px; border-radius: 4px; font-size: 13px; }
.upload-result.success { background: #e8f5e9; color: #2e7d32; }
.upload-result.error { background: #ffebee; color: #c62828; }

/* Collapsible card */
.collapsible-header { cursor: pointer; user-select: none; display: flex; justify-content: space-between; align-items: center; }
.collapsible-header .collapse-arrow { font-size: 12px; color: #999; transition: transform 0.2s; }
.collapsible-header .collapse-arrow.open { transform: rotate(180deg); }

/* Diff viewer */
.diff-viewer { font-family: "SF Mono", Monaco, monospace; font-size: 12px; background: #fafafa; border: 1px solid #e0e0e0; border-radius: 4px; padding: 12px; max-height: 500px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
.diff-viewer .diff-header { color: #999; }
.diff-viewer .diff-hunk { color: #1565c0; background: #e3f2fd; }
.diff-viewer .diff-add { color: #2e7d32; background: #e8f5e9; }
.diff-viewer .diff-del { color: #c62828; background: #ffebee; }
</style>
</head>

>description: "代码审查助手 - 自动审查代码并提供改进建议"

  - "团队 code review 时需要标准化的审查建议"
  - "个人开发者想检查自己代码的潜在问题"

input_output:
  input: "一段代码（支持 Python、JavaScript、Go 等主流语言）"
  output: "结构化的审查报告，包含问题列表、严重等级和改进建议"

rule:
  - "必须从安全性、性能、可读性、正确性四个维度审查"
  - "每个问题必须标注严重等级（critical/warning/info）"

example:
  - input: |
      def login(username, password):
          query = f"SELECT * FROM users WHERE username='{username}' AND password='{password}'"
          result = db.execute(query)
          return result.fetchone()
    output: |
      ## 审查报告

      ### [CRITICAL] SQL 注入漏洞
      使用字符串拼接构建 SQL 查询，存在 SQL 注入风险。
      **建议：** 使用参数化查询。
      ```python
      query = "SELECT * FROM users WHERE username=? AND password=?"
      result = db.execute(query, (username, password))
      ```

      ### [CRITICAL] 明文密码比较
      密码未使用哈希比较，存在安全隐患。
      **建议：** 使用 bcrypt 或 argon2 进行密码哈希验证。

      ### [WARNING] 缺少错误处理
      数据库查询可能失败但未处理异常。

  - input: |

        if (n <= 0) return 0;
        if (n === 1) return 1;
        return fibonacci(n - 1) + fibonacci(n - 2);
      }
    output: |
      ## 审查报告

      ### [WARNING] 指数级时间复杂度
      递归实现导致 O(2^n) 时间复杂度，n 较大时性能极差。
      **建议：** 使用动态规划或迭代方式。
      ```javascript
      function fibonacci(n) {
        if (n <= 0) return 0;
        if (n === 1) return 1;
        let a = 0, b = 1;
        for (let i = 2; i <= n; i++) {
          [a, b] = [b, a + b];
        }
        return b;
      }
      ```

<script>
// --- Tab switching ---
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});

// --- Data loading ---
async function loadOptions() {
  const [skills, specs] = await Promise.all([
    fetch('/api/skills').then(r => r.json()),
    fetch('/api/specs').then(r => r.json()),
  ]);
  fillSelect('eval-skill', skills);
  fillSelect('evolve-skill', skills);
  fillSelect('create-spec', specs);
  fillSelect('eval-spec', specs, true);
  fillSelect('evolve-spec', specs, true);
}

function fillSelect(id, items, optional = false) {
  const sel = document.getElementById(id);
  const first = sel.options[0];
  sel.innerHTML = '';
  sel.appendChild(first);
  if (optional) {
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = '-- 不使用 --';
    sel.appendChild(opt);
  }
  items.forEach(item => {
    const opt = document.createElement('option');
    opt.value = item.name;
    opt.textContent = item.name;
    sel.appendChild(opt);
  });
}

loadOptions();

// --- Test cases management ---
let _evalTcEdited = false;
let _evalTcCurrentName = ''; // 当前加载的测试用例名称

function formatTestCases(tcList) {
  if (!tcList) return '';
  return JSON.stringify(tcList, null, 2);
}

function parseTcContent(content) {
  let testCases = JSON.parse(content);
  if (!Array.isArray(testCases)) {
    if (testCases.test_cases && Array.isArray(testCases.test_cases)) {
      testCases = testCases.test_cases;
    } else {
      throw new Error('格式错误');
    }
  }
  return testCases;
}

// 加载某技能的测试用例列表
async function listTestCases(skillName) {
  if (!skillName) return [];
  return await fetch('/api/test-cases/' + encodeURIComponent(skillName)).then(r => r.json());
}

// 填充测试用例下拉框
function fillTcSelect(selectId, items) {
  const sel = document.getElementById(selectId);
  const first = sel.options[0];
  sel.innerHTML = '';
  sel.appendChild(first);
  items.forEach(item => {
    const opt = document.createElement('option');
    opt.value = item.name;
    opt.textContent = item.name;
    sel.appendChild(opt);
  });
}

// Eval Tab: skill change → 刷新测试用例下拉框
async function onEvalSkillChange() {
  const skill = document.getElementById('eval-skill').value;
  _evalTcEdited = false;
  _evalTcCurrentName = '';
  document.getElementById('eval-tc-content').value = '';
  if (skill) {
    const items = await listTestCases(skill);
    fillTcSelect('eval-tc-select', items);
  } else {
    fillTcSelect('eval-tc-select', []);
  }
}

// Eval Tab: 选择已保存的测试用例
async function onEvalTcSelect() {
  const skill = document.getElementById('eval-skill').value;
  const name = document.getElementById('eval-tc-select').value;
  if (!skill || !name) return;
  const data = await fetch('/api/test-cases/' + encodeURIComponent(skill) + '/' + encodeURIComponent(name)).then(r => r.json());
  if (data.error) return alert(data.error);
  document.getElementById('eval-tc-content').value = formatTestCases(data.test_cases);
  _evalTcEdited = false;
  _evalTcCurrentName = name;
}

function onEvalTcEdit() {
  _evalTcEdited = true;
}

// Save test cases (prompt for name)
async function saveEvalTestCases() {
  const skill = document.getElementById('eval-skill').value;
  if (!skill) return alert('请先选择 Skill');
  const content = document.getElementById('eval-tc-content').value.trim();
  if (!content) return alert('测试用例为空');
  let testCases;
  try {
    testCases = parseTcContent(content);
  } catch(e) {
    return alert('JSON 格式错误: ' + e.message);
  }
  const defaultName = _evalTcCurrentName || 'default';
  const name = prompt('请输入测试用例名称:', defaultName);
  if (!name || !name.trim()) return;

  const resp = await fetch('/api/test-cases/' + encodeURIComponent(skill), {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name: name.trim(), test_cases: testCases}),
  }).then(r => r.json());
  if (resp.error) return alert('保存失败: ' + resp.error);
  _evalTcCurrentName = name.trim();

// --- Multi-task tracking ---
const runningTasks = new Set();

function addRunningTask(taskId) {
  runningTasks.add(taskId);
  updateTaskIndicator();
}

function removeRunningTask(taskId) {
  runningTasks.delete(taskId);
  updateTaskIndicator();
}

function updateTaskIndicator() {
  const dot = document.querySelector('#taskIndicator .dot');
  const text = document.getElementById('taskStatus');
  const count = runningTasks.size;
  if (count > 0) {
    dot.className = 'dot running';
    text.textContent = count + ' 个任务运行中';
  } else {
    dot.className = 'dot idle';
    text.textContent = '空闲';
  }
}

// --- SSE helper ---
function connectSSE(url, taskId, onEvent, onDone) {
  const es = new EventSource(url);
  es.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === 'done') {
      es.close();
      removeRunningTask(taskId);
      if (onDone) onDone(data);
    } else {
      if (onEvent) onEvent(data);
    }
  };
  es.onerror = () => {
    es.close();
    removeRunningTask(taskId);
  };
  return es;
}

// --- Create task card for each running task ---
function createTaskCard(panelId, taskId, label) {
  const panel = document.getElementById(panelId);
  // 在表单 card 后面插入
  const formCard = panel.querySelector('.card');
  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'task-card-' + taskId;
  card.innerHTML = `
    <h3 style="display:flex;justify-content:space-between;align-items:center">
      <span>${label}</span>
      <span style="font-size:11px;color:#888;font-weight:400">${taskId}</span>
    </h3>
    <div class="progress-area" id="log-${taskId}"></div>
    <div id="live-table-area-${taskId}"></div>
    <div id="result-area-${taskId}"></div>
  `;
  formCard.insertAdjacentElement('afterend', card);
  return card;
}

// --- Log helper ---
function appendLog(taskId, message, cls = '') {
  const el = document.getElementById('log-' + taskId);
  if (!el) return;
  const line = document.createElement('div');
  line.className = 'log-line ' + cls;
  line.textContent = message;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

async function startUploadSkill() {
  const fileInput = document.getElementById('upload-skill-file');
  const file = fileInput.files[0];
  if (!file) return alert('请先选择 .zip 文件');

  const btn = document.getElementById('upload-btn');
  btn.disabled = true;
  btn.textContent = '上传中...';

  const name = document.getElementById('upload-skill-name').value.trim();
  const formData = new FormData();
  formData.append('file', file);
  if (name) formData.append('name', name);

  try {
    const resp = await fetch('/api/upload-skill', { method: 'POST', body: formData }).then(r => r.json());
    // 移除旧的结果提示
    const old = document.querySelector('.upload-result');
    if (old) old.remove();

    const resultEl = document.createElement('div');
    if (resp.error) {
      resultEl.className = 'upload-result error';
      resultEl.textContent = resp.error;
    } else {
      resultEl.className = 'upload-result success';
      resultEl.textContent = '技能「' + resp.name + '」上传成功！包含 ' + (resp.files || []).length + ' 个文件';
      // 刷新 skills 列表
      const skills = await fetch('/api/skills').then(r => r.json());
      fillSelect('eval-skill', skills);
      fillSelect('evolve-skill', skills);
      // 重置上传区域

async function loadEvolveVersions(taskId, result) {
  const skill = document.getElementById('evolve-skill').value;
  // 从 result 中找 run_id：通过 results API 获取最新的 run
  const runs = await fetch('/api/results').then(r => r.json());
  const skillResult = runs.find(r => r.skill === skill);
  if (!skillResult || !skillResult.evolve_runs.length) return;

  // 用最新的 run
  const runId = skillResult.evolve_runs[skillResult.evolve_runs.length - 1].id;
  // 存储供后续使用
  window['_evolve_' + taskId] = { skill, runId };

  const data = await fetch('/api/evolve-versions/' + encodeURIComponent(skill) + '/' + encodeURIComponent(runId)).then(r => r.json());
  if (data.error) return;

  const versions = data.versions;
  const bestId = (versions.find(v => v.best) || versions[0]).id;

  // 填充 select
  const opts = versions.map(v => {
    const tag = v.best ? ' [BEST]' : (v.accepted ? ' [OK]' : '');
    const skip = v.skip_reason ? ' [SKIP]' : '';
    return `<option value="${v.id}">${v.label} (${(v.rate||0).toFixed(4)})${tag}${skip}</option>`;
  }).join('');

  const fromSel = document.getElementById('vdiff-from-' + taskId);
  const toSel = document.getElementById('vdiff-to-' + taskId);
  const actSel = document.getElementById('vaction-ver-' + taskId);
  if (fromSel) { fromSel.innerHTML = opts; fromSel.value = 'baseline'; }
  if (toSel) { toSel.innerHTML = opts; toSel.value = bestId; }
  if (actSel) { actSel.innerHTML = opts; actSel.value = bestId; }

  // 自动加载一次 diff
  loadEvolveDiff(taskId);
}

async function loadEvolveDiff(taskId) {
  const info = window['_evolve_' + taskId];
  if (!info) return;
  const from = document.getElementById('vdiff-from-' + taskId).value;
  const to = document.getElementById('vdiff-to-' + taskId).value;
  if (from === to) {
    document.getElementById('vdiff-result-' + taskId).innerHTML = '<div style="color:#888;font-size:12px">请选择不同的版本</div>';
    return;
  }

  const el = document.getElementById('vdiff-result-' + taskId);
  el.innerHTML = '<div style="color:#888;font-size:12px">加载中...</div>';

  const diff = await fetch('/api/evolve-diff/' + encodeURIComponent(info.skill) + '/' + encodeURIComponent(info.runId) + '?frm=' + encodeURIComponent(from) + '&to=' + encodeURIComponent(to)).then(r => r.text());

  if (diff === '(无变化)' || !diff.trim()) {
    el.innerHTML = '<div style="color:#888;font-size:12px">两个版本无差异</div>';
    return;
  }

  // 渲染 unified diff
  const lines = diff.split('\n');
  let html = '<div class="diff-viewer">';
  for (const line of lines) {
    let cls = '';
    if (line.startsWith('+++') || line.startsWith('---')) cls = 'diff-header';
    else if (line.startsWith('@@')) cls = 'diff-hunk';
    else if (line.startsWith('+')) cls = 'diff-add';
    else if (line.startsWith('-')) cls = 'diff-del';
    html += `<div class="${cls}">${line.replace(/</g, '&lt;')}</div>`;
  }
  html += '</div>';
  el.innerHTML = html;
}

function downloadEvolveVersion(taskId) {
  const info = window['_evolve_' + taskId];
  if (!info) return;
  const version = document.getElementById('vaction-ver-' + taskId).value;
  window.open('/api/evolve-download/' + encodeURIComponent(info.skill) + '/' + encodeURIComponent(info.runId) + '/' + encodeURIComponent(version));
}

async function applyEvolveVersion(taskId) {
  const info = window['_evolve_' + taskId];
  if (!info) return;
  const version = document.getElementById('vaction-ver-' + taskId).value;
  if (!confirm('确定将「' + version + '」版本应用到当前技能？当前技能将被备份。')) return;

  const resp = await fetch('/api/evolve-apply/' + encodeURIComponent(info.skill) + '/' + encodeURIComponent(info.runId) + '/' + encodeURIComponent(version), { method: 'POST' }).then(r => r.json());
  if (resp.error) {
    alert('应用失败: ' + resp.error);
  } else {
    alert('已应用「' + version + '」版本，备份保存在 ' + resp.backup);
    // 刷新 skills 列表
    const skills = await fetch('/api/skills').then(r => r.json());
    fillSelect('eval-skill', skills);
    fillSelect('evolve-skill', skills);
  }
}
</script>
