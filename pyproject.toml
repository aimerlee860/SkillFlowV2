[project]
name = "skillflow"
version = "0.1.0"
description = "Skill creation, evaluation and evolution framework based on deepagents"
requires-python = ">=3.12"
dependencies = [
    "deepagents",
    "langchain-core>=1.2.21",
    "langchain>=1.2.11",
    "python-dotenv",
    "pyyaml",
    "rich",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",
]

[project.scripts]
skillflow = "skillflow.__main__:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
